version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: qa_postgres
    environment:
      POSTGRES_DB: qa_generator
      POSTGRES_USER: qa_user
      POSTGRES_PASSWORD: qa_password123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: qa_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: qa_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://qa_user:qa_password123@postgres:5432/qa_generator
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: super-secret-key-change-in-production-qa-gen-2026-secure-jwt
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: AdminSecret123!
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    container_name: qa_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
