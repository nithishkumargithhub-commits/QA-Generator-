<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>
    <linearGradient id="brainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Card -->
  <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Brain AI Icon -->
  <g transform="translate(100, 100) scale(12.5)" stroke="url(#brainGrad)" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Hemisphere -->
    <path d="M12 4.5A4.5 4.5 0 0 0 7.5 9c0 1.4.6 2.6 1.6 3.5C8.1 13.4 7.5 14.6 7.5 16a4.5 4.5 0 0 0 4.5 4.5" />
    <path d="M12 4.5v16" />
    <!-- Right Hemisphere -->
    <path d="M12 4.5A4.5 4.5 0 0 1 16.5 9c0 1.4-.6 2.6-1.6 3.5.9.9 1.6 2.1 1.6 3.5a4.5 4.5 0 0 1-4.5 4.5" />
    <!-- Neural Nodes -->
    <circle cx="8" cy="9" r="0.7" fill="#FFF" />
    <circle cx="16" cy="9" r="0.7" fill="#FFF" />
    <circle cx="9.5" cy="14" r="0.7" fill="#FFF" />
    <circle cx="14.5" cy="14" r="0.7" fill="#FFF" />
    <circle cx="8" cy="18" r="0.7" fill="#FFF" />
    <circle cx="16" cy="18" r="0.7" fill="#FFF" />
    <!-- Connecting Synapses -->
    <line x1="8" y1="9" x2="9.5" y2="14" />
    <line x1="16" y1="9" x2="14.5" y2="14" />
    <line x1="9.5" y1="14" x2="8" y2="18" />
    <line x1="14.5" y1="14" x2="16" y2="18" />
  </g>
</svg>
